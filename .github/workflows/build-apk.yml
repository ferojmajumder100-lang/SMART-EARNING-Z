name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed APK (JDK 21 + Gradle 9.3.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Java & Gradle Versions
        run: |
          java -version
          gradle --version

      - name: Setup Keystores via CLI (keytool)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Debug Keystore (required by app/build.gradle debugConfig)
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Release Keystore via CLI (uses GitHub Secrets if set, else reuses fixed debug.keystore so signature stays identical across every build)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "SIGN_KS=release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASS=${KEYSTORE_PASSWORD:-arafat1234}" >> "$GITHUB_ENV"
            echo "SIGN_ALIAS=${KEY_ALIAS:-arafat_release}" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASS=${KEY_PASSWORD:-arafat1234}" >> "$GITHUB_ENV"
          else
            cp debug.keystore release.keystore
            echo "SIGN_KS=release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASS=android" >> "$GITHUB_ENV"
            echo "SIGN_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASS=android" >> "$GITHUB_ENV"
          fi

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Zipalign & Sign Release APK via CLI (apksigner)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/ARAFT-release-signed.apk"

          if [ -f "$UNSIGNED_APK" ]; then
            "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "${SIGN_KS}" \
              --ks-pass "pass:${STORE_PASS}" \
              --ks-key-alias "${SIGN_ALIAS}" \
              --key-pass "pass:${SIGN_KEY_PASS}" \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
            "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          else
            echo "Unsigned release APK not found!"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ARAFT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ARAFT-release-signed-apk
          path: app/build/outputs/apk/release/ARAFT-release-signed.apk
          if-no-files-found: error
